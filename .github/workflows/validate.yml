name: Validate standards package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Validate API audit helper
        run: python -B -m unittest discover -s skills/api-contract-docs/scripts -p "test_*.py"
