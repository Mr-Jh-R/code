name: Validate standards package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Validate API audit helper
        run: python -B -m unittest discover -s skills/api-contract-docs/scripts -p "test_*.py"
      - name: Validate local standards store
        run: python -B -m unittest discover -s skills/standards-check/scripts -p "test_*.py"

  python-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated example dependencies
        run: python -m pip install -r conventions/backend/examples/python/requirements.txt
      - name: Verify Python response and exception contract
        run: python -B -m unittest discover -s conventions/backend/examples/python -p "test_*.py"
